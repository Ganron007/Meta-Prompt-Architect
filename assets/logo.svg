<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb224"/>
      <stop offset="100%" stop-color="#d99410"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ad9b5"/>
      <stop offset="100%" stop-color="#1a9e82"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffb224" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="75%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3ad9b5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3ad9b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#0b1512"/>

  <!-- Subtle grid -->
  <g stroke="#7aa88f" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Ambient glows -->
  <rect width="512" height="512" rx="64" fill="url(#glowA)"/>
  <rect width="512" height="512" rx="64" fill="url(#glowB)"/>

  <!-- Outer diamond (rotated square) — amber -->
  <rect x="176" y="176" width="160" height="160" rx="18"
        fill="url(#amberGrad)"
        transform="rotate(45 256 256)"/>

  <!-- Inner diamond — dark cutout -->
  <rect x="216" y="216" width="80" height="80" rx="10"
        fill="#0b1512"
        transform="rotate(45 256 256)"/>

  <!-- Center dot — teal accent -->
  <circle cx="256" cy="256" r="14" fill="url(#tealGrad)"/>

  <!-- Corner accents — drafting marks -->
  <g stroke="#3ad9b5" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M 80 96 L 80 80 L 96 80" fill="none"/>
    <path d="M 416 80 L 432 80 L 432 96" fill="none"/>
    <path d="M 432 416 L 432 432 L 416 432" fill="none"/>
    <path d="M 96 432 L 80 432 L 80 416" fill="none"/>
  </g>

  <!-- Subtle orbit ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#3ad9b5" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8"/>
</svg>
